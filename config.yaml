# ============================================================
#  config.yaml  -  Unified parameter file for run_pipeline.m
#  Edit this file to change any setting. No .m file changes needed.
#
#  tau_alpha_max, tau_gaussian, surface_filtering_threshold
#  converted to "auto" mode (data-driven, percentile-based).
#  Set any value to a fixed number to override auto behaviour.
# ============================================================

dataset:
  name: "ABC-NEF"
  scene: "00000325"
  curve_graph_file: "auto"
  num_views: 0

run_preferance:
   run_parallel_for: 0

preprocess:
  smoothing: 0
  smoothing_window: 500
  apply_length_constraints: 0
  tau_length: 0.15
  tau_num_of_pts: 500
  gaussian_derivative_sigma: 10
  gaussian_derivative_data_range: 20
  break_curves: 0
  min_break_curvature: 0.0025
  plot: 1
  debug: 1
  debug_colormap_curve_index: 10
  plot_3d_tangents: 0
  save_curves_after_length_constraint: 0

proximity:
  tau_alpha_min: 0.2
  tau_alpha_max: "auto"       # auto = data-driven (percentile or mean_sigma mode)
  tau_alpha_percentile: 75    # used when tau_alpha_mode is percentile (default)
  # tau_alpha_mode: "mean_sigma"  # uncomment to use mean + N*std
  # tau_alpha_sigma: 2.0          # N for mean_sigma (default 2.0)
  plot: 0
  has_ground_truth: 0

gaussian_filter:
  tau_gaussian: "auto"
  tau_gaussian_percentile: 70  # used when tau_gaussian_mode is percentile (default)
  # tau_gaussian_mode: "mean_sigma"  # uncomment to use mean + N*std
  # tau_gaussian_sigma: 2.0          # N for mean_sigma (default 2.0)
  plot: 0
  has_ground_truth: 1

occlusion:
  tau_orientation: 0.17453
  tau_distance: 3
  tau_distance_diff: 0.2
  generate_matches: 1
  ray_tracing: 1
  surface_filtering: 1
  surface_filtering_threshold: 225   # fixed; recovers (2,5) with zero false positives
  # surface_filtering_mode: "mean_sigma"  # uncomment to use mean + N*std of occ scores
  # surface_filtering_sigma: 2.0          # N for mean_sigma (default 2.0)
  save_match_plot_2d: 0
  show_plot_match: 0
  plot_match_view: 10
  img_rows: 800
  img_cols: 800